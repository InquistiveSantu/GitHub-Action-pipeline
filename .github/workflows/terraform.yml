name: Terraform CI

on:
  push:
    branches:
      - feature/pipeline

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Env_prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan