name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/pipeline
      - 'feature/**'
  pull_request:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID || '53d32f59-988d-40ea-892f-9b983abd8f8a' }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET || 'Ja68Q~8z8Bwdtl93dpgtexiZDyNSXxTKxtFN7cpG' }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID || '1901e74c-f287-4ad5-a027-7e82572afe7a' }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID || 'ce1221be-2dd4-4dbd-be67-4765d692baf9' }}

jobs:
  terraform-plan:
    name: "Terraform Plan & Validate"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Env_prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..

      - name: Azure Login
        run: |
          az login --service-principal \
            -u "${{ env.ARM_CLIENT_ID }}" \
            -p "${{ env.ARM_CLIENT_SECRET }}" \
            --tenant "${{ env.ARM_TENANT_ID }}"
          az account set --subscription "${{ env.ARM_SUBSCRIPTION_ID }}"

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Env_prod/tfplan

  terraform-apply:
    name: "Terraform Apply (Main Branch Only)"
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Env_prod

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login --service-principal \
            -u "${{ env.ARM_CLIENT_ID }}" \
            -p "${{ env.ARM_CLIENT_SECRET }}" \
            --tenant "${{ env.ARM_TENANT_ID }}"
          az account set --subscription "${{ env.ARM_SUBSCRIPTION_ID }}"

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: Env_prod

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan